[project]
name = "kpi-scorecard-api"
version = "0.1.0"
description = "KPI math, driver analysis, faithfulness check, and eval runner for KPI Scorecard Autopilot"
requires-python = ">=3.11"
dependencies = [
    # Pinned to the tested versions; requirements.lock pins everything below them.
    "fastapi==0.159.1",
    "uvicorn[standard]==0.54.0",
    "psycopg[binary]==3.3.6",
    "httpx==0.28.1",  # HTTP client for the Ollama and Azure OpenAI providers
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Ollama models; skipped unless pytest --live"]

# Ruff settings live in /ruff.toml so they cover api/ and scripts/ alike.
